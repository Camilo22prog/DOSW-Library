spring:
  application:
    name: DOSW-Library

  datasource:
    url: jdbc:postgresql://localhost:5432/dosw_library
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  secret: "dosw-library-super-secret-key-eci-colombia-noveno-semestre-2024"
  expiration: 86400000

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
