# application.yaml
spring:
  application:
    name: DOSW-Library

  profiles:
    active: mongo  # ← Cambia a 'relational' para usar PostgreSQL

jwt:
  secret: "dosw-library-super-secret-key-eci-colombia-noveno-semestre-2024"
  expiration: 86400000

server:
  port: ${PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

---
# Perfil MONGO
spring:
  config:
    activate:
      on-profile: mongo

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://juanmelo3243_db_user:TVkDoGPLxaL1Bpwy@cluster0.z6v8xet.mongodb.net/?appName=Cluster0}
      database: dosw_library

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

---
# Perfil RELATIONAL
spring:
  config:
    activate:
      on-profile: relational

  datasource:
    url: jdbc:postgresql://localhost:5432/dosw_library
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration