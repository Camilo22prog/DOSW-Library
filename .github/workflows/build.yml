name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: BUILD — solo compila el proyecto
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compilar proyecto (fase compile)
        run: mvn compile -B

  # ─────────────────────────────────────────────
  # JOB 2: TEST
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      SPRING_PROFILES_ACTIVE: relational
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Ejecutar tests (fase verify)
        run: mvn verify -B

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: ANALYSIS
  # ─────────────────────────────────────────────
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    needs: test
    env:
      SPRING_PROFILES_ACTIVE: relational
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, verify y análisis SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Camilo22prog_DOSW-Library
          -Dsonar.organization=camilo22prog
          -Dsonar.host.url=https://sonarcloud.io

      - name: Descargar reporte JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco-report/

      - name: Resumen de cobertura en consola
        run: |
          echo "========================================"
          echo "   REPORTE DE COBERTURA - JaCoCo"
          echo "========================================"
          ls -la jacoco-report/ || echo "Sin reporte disponible"

    # ─────────────────────────────────────────────
  # JOB 4: DEPLOY — Azure App Service via Kudu
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Deploy via Kudu API
        env:
            PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo $PUBLISH_PROFILE | grep -oP '(?<=userName=")[^"]+' | head -1)
          PASS=$(echo $PUBLISH_PROFILE | grep -oP '(?<=userPWD=")[^"]+' | head -1)
          SCM_URL=$(echo $PUBLISH_PROFILE | grep -oP '(?<=publishUrl=")[^"]+' | head -1)
          JAR=$(ls target/*.jar | grep -v original | head -1)
            
          echo "SCM URL: $SCM_URL"
          echo "Desplegando $JAR..."
            
          curl -X POST \
            "https://$SCM_URL/api/wardeploy" \
            -u "$USER:$PASS" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @$JAR \
            --fail \
            -w "\nHTTP Status: %{http_code}\n"